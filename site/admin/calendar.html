    <style>
      /* 승인된 M01 압축형 주간 시간표 */
      .cc-week-wrap { overflow-x:auto; border:1px solid var(--c-border); border-radius:var(--radius); background:var(--c-surface); }
      .cc-week-grid { min-width:780px; display:grid; grid-template-columns:56px repeat(7,minmax(100px,1fr)); grid-template-rows:34px repeat(13,40px); position:relative; }
      .cc-week-grid > * { border-right:1px solid var(--c-border-soft); border-bottom:1px solid var(--c-border-soft); min-width:0; }
      .cc-week-day { padding:6px 4px; text-align:center; font-size:12px; font-weight:700; background:#fafbfc; }
      .cc-week-day.today { background:#f5f6f7; color:#282d34; }
      .cc-week-hour { padding:4px 5px; text-align:right; font-size:11px; color:var(--c-text-sub); background:#fafbfc; }
      .cc-week-slot { border:0; background:var(--c-surface); padding:0; cursor:pointer; }
      .cc-week-slot:hover { background:var(--c-brand-soft); }
      .cc-week-slot.late { background:#f8f9fb; cursor:not-allowed; }
      .cc-week-event { z-index:2; margin:2px; padding:4px 7px; border:0; border-left:3px solid #2563eb; border-radius:5px; background:#eaf1ff; color:#1e3a8a; text-align:left; overflow:hidden; font:11px/1.3 inherit; cursor:pointer; }
      .cc-week-event strong { display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .cc-week-event span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .cc-week-event { display:flex; flex-direction:column; justify-content:flex-start; background:#f8fafc; color:#2c333c; border:0; border-left-width:2px; border-left-style:solid; border-radius:3px; margin:3px 4px; padding:6px 7px; box-shadow:none; font-size:10px; line-height:1.45; }
      .cc-week-event strong { font-size:12px; font-weight:600; }
      .cc-week-event span { color:#67717e; font-size:11px; }
      .cc-week-event.design { background:#f8fafc; color:#2c333c; }
      .cc-week-event.buffer { border-left:2px solid #c7cdd4; background:#f3f4f5; color:#65707c; font-size:10px; font-weight:400; justify-content:center; padding:3px 7px; margin:0 4px 3px; }
      .cc-week-event:hover { background:#eaf0f5; color:#202934; outline:1px solid #aeb9c5; outline-offset:-1px; }
      .cc-week-event.design:hover { background:#eaf0f5; color:#202934; }
      .cc-week-event.buffer:hover,.cc-week-event.buffer:disabled { background:#f3f4f5; color:#65707c; outline:0; }
      .cc-week-event.legacy { border-style:dashed; }
      .cc-week-event.cancelled { border-left-color:#9ca3af; background:#f3f4f6; color:#6b7280; text-decoration:line-through; }
      .cc-week-slot { border-right:1px solid var(--c-border-soft); border-bottom:1px solid var(--c-border-soft); }
      .cc-week-event .cc-week-time { color:#4b5563; font-size:11px; }
      .cc-week-event .cc-week-customer { color:#67717e; font-size:11px; }
      .cc-sum { gap:0; margin-bottom:14px; border:1px solid var(--c-border); border-radius:var(--radius); background:var(--c-surface); box-shadow:none; }
      .cc-sum .card { border:0; border-right:1px solid var(--c-border-soft); border-radius:0; padding:10px 14px; box-shadow:none; background:transparent; }
      .cc-sum .card:last-child { border-right:0; }
      .cc-sum .card.accent { border-color:var(--c-border-soft); background:var(--c-surface); }
      .cc-sum .label { margin-bottom:4px; font-size:11px; }
      .cc-sum .value { font-size:20px; }
      .cc-bar { border:0; border-bottom:1px solid var(--c-border); border-radius:0; padding:0 0 10px; background:transparent; box-shadow:none; }
      .cc-cal { box-shadow:none; }
      .cc-side { box-shadow:none; }
      .cc-side-head { background:var(--c-surface); color:var(--c-text); }
      .cc-side-head .n { color:var(--c-text-sub); }
      .cc-week-loading { padding:24px; text-align:center; color:var(--c-text-sub); }
      .cc-settings-link { white-space:nowrap; }
      @media (max-width:640px) { .cc-week-grid { min-width:720px; grid-template-columns:48px repeat(7,minmax(96px,1fr)); } }
      /* 상담 지점별 식별색 — 캘린더 칩과 필터 점이 같은 색을 쓴다 */
      .cc {
        --br-gangnam: #2563eb;
        --br-pangyo: #16a34a;
        --br-onsite: #f59e0b;
        --br-online: #8b5cf6;
        --br-etc: #64748b;
      }

      /* ── 요약 ── */
      .cc-sum {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }
      .cc-sum .card {
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: var(--radius);
        padding: 14px 16px;
        box-shadow: var(--shadow-card);
      }
      .cc-sum .card.accent {
        border-color: var(--c-brand);
        background: var(--c-brand-soft);
      }
      .cc-sum .label {
        font-size: 12px;
        color: var(--c-text-sub);
        margin-bottom: 6px;
      }
      .cc-sum .value {
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
      }
      .cc-sum .value small {
        font-size: 13px;
        font-weight: 500;
        color: var(--c-text-sub);
        margin-left: 3px;
      }

      /* ── 툴바 ── */
      .cc-bar {
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: var(--radius);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        box-shadow: var(--shadow-card);
      }
      .cc-month {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cc-month .m {
        font-size: 17px;
        font-weight: 700;
        min-width: 108px;
        text-align: center;
      }
      .cc-sp {
        flex: 1;
      }
      .cc-filter {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cc-chip {
        border: 1px solid var(--c-border);
        background: var(--c-surface);
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: inherit;
        color: var(--c-text-sub);
      }
      .cc-chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      .cc-chip.on {
        border-color: var(--c-text);
        color: var(--c-text);
        font-weight: 600;
        background: #f9fafb;
      }
      .cc-chip:not(.on) {
        opacity: 0.45;
      }

      /* ── 본문 2단 ── */
      .cc-cols {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 16px;
        align-items: start;
      }

      /* ── 월 캘린더 ── */
      .cc-cal {
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow-card);
      }
      .cc-dow {
        display: grid;
        /* 1fr 로 두면 칩의 nowrap 최소폭이 열을 밀어 격자가 화면을 넘는다 */
        grid-template-columns: repeat(7, minmax(0, 1fr));
        border-bottom: 1px solid var(--c-border);
        background: #fafbfc;
      }
      .cc-dow div {
        padding: 9px 0;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--c-text-sub);
      }
      .cc-dow div:first-child {
        color: #dc2626;
      }
      .cc-dow div:last-child {
        color: #2563eb;
      }
      .cc-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }
      .cc-cell {
        min-height: 112px;
        border-right: 1px solid var(--c-border-soft);
        border-bottom: 1px solid var(--c-border-soft);
        padding: 6px 6px 8px;
        cursor: pointer;
        background: var(--c-surface);
        text-align: left;
        font: inherit;
        color: inherit;
      }
      .cc-cell:nth-child(7n) {
        border-right: 0;
      }
      .cc-cell:hover {
        background: #fafbfc;
      }
      .cc-cell.other {
        background: #fbfbfc;
      }
      .cc-cell.other .d {
        color: var(--c-text-muted);
      }
      .cc-cell.sel {
        background: var(--c-brand-soft);
        box-shadow: inset 0 0 0 2px var(--c-brand);
      }
      .cc-cell .d {
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        margin-bottom: 4px;
      }
      .cc-cell.sun .d {
        color: #dc2626;
      }
      .cc-cell.sat .d {
        color: #2563eb;
      }
      .cc-cell.today .d {
        background: var(--c-brand);
        color: #fff;
      }
      .cc-ev {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 4px;
        padding: 3px 6px;
        margin-bottom: 3px;
        font-size: 11.5px;
        line-height: 1.35;
        color: #fff;
        font-family: inherit;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cc-ev .t {
        font-weight: 700;
        margin-right: 4px;
      }
      .cc-ev.b-gangnam {
        background: var(--br-gangnam);
      }
      .cc-ev.b-pangyo {
        background: var(--br-pangyo);
      }
      .cc-ev.b-onsite {
        background: var(--br-onsite);
      }
      .cc-ev.b-online {
        background: var(--br-online);
      }
      .cc-ev.b-etc {
        background: var(--br-etc);
      }
      .cc-ev.dim {
        opacity: 0.45;
      }
      /* 취소는 지우지 않고 취소선으로 남긴다 */
      .cc-ev.cancelled {
        background: #e5e7eb;
        color: #6b7280;
        text-decoration: line-through;
      }
      .cc-more {
        font-size: 11px;
        color: var(--c-text-sub);
        padding-left: 4px;
      }

      /* ── 선택일 패널 ── */
      .cc-side {
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }
      .cc-side-head {
        padding: 14px 16px;
        border-bottom: 1px solid var(--c-border);
        background: var(--c-sidebar);
        color: #fff;
      }
      .cc-side-head .d {
        font-size: 16px;
        font-weight: 700;
      }
      .cc-side-head .n {
        font-size: 12px;
        color: #cbd5e1;
        margin-top: 3px;
      }
      .cc-side-body {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 620px;
        overflow-y: auto;
      }
      .cc-bk {
        border: 1px solid var(--c-border);
        border-left: 4px solid var(--c-border);
        border-radius: var(--radius-sm);
        padding: 11px 12px;
      }
      .cc-bk.b-gangnam {
        border-left-color: var(--br-gangnam);
      }
      .cc-bk.b-pangyo {
        border-left-color: var(--br-pangyo);
      }
      .cc-bk.b-onsite {
        border-left-color: var(--br-onsite);
      }
      .cc-bk.b-online {
        border-left-color: var(--br-online);
      }
      .cc-bk.b-etc {
        border-left-color: var(--br-etc);
      }
      .cc-bk.cancelled {
        border-left-color: #9ca3af;
        background: #fafafa;
      }
      .cc-bk.cancelled .cc-bk-time,
      .cc-bk.cancelled .cc-bk-name {
        color: var(--c-text-sub);
        text-decoration: line-through;
      }
      .cc-cancel-tag {
        margin-left: auto;
        font-size: 11px;
        font-weight: 700;
        color: #b91c1c;
        background: #fef2f2;
        border-radius: 999px;
        padding: 2px 8px;
      }
      .cc-bk-status.off {
        background: #f3f4f6;
        color: var(--c-text-sub);
      }
      .cc-bk-top {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 7px;
      }
      .cc-bk-time {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .cc-bk-branch {
        font-size: 12px;
        color: var(--c-text-sub);
      }
      .cc-bk-name {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .cc-bk-meta {
        font-size: 12.5px;
        color: var(--c-text-sub);
        line-height: 1.6;
      }
      .cc-bk-status {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #eff6ff;
        color: #1d4ed8;
        margin-top: 7px;
      }
      .cc-bk-actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .cc-bk-actions .btn {
        flex: 1;
        padding: 6px 0;
        text-align: center;
        font-size: 12.5px;
      }
      .cc-empty {
        text-align: center;
        color: var(--c-text-muted);
        font-size: 13px;
        padding: 36px 12px;
        line-height: 1.7;
      }

      /* ── 다가오는 미팅일정 ── */
      .cc-up {
        margin-top: 16px;
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }
      .cc-up-head {
        padding: 12px 16px;
        border-bottom: 1px solid var(--c-border);
        font-weight: 700;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .cc-up-head .hint {
        font-size: 12px;
        font-weight: 400;
        color: var(--c-text-sub);
      }
      table.cc-up-t {
        width: 100%;
        border-collapse: collapse;
      }
      table.cc-up-t th,
      table.cc-up-t td {
        text-align: left;
        padding: 10px 16px;
        border-bottom: 1px solid var(--c-border-soft);
        font-size: 13px;
      }
      table.cc-up-t th {
        font-size: 12px;
        color: var(--c-text-sub);
        font-weight: 600;
        background: #fafbfc;
      }
      table.cc-up-t tr:last-child td {
        border-bottom: 0;
      }
      .cc-dday {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        background: #f3f4f6;
        color: var(--c-text-sub);
        white-space: nowrap;
      }
      .cc-dday.soon {
        background: #fef2f2;
        color: #b91c1c;
      }
      .cc-dday.today {
        background: var(--c-brand);
        color: #fff;
      }
      .cc-dday.cancel {
        background: #fef2f2;
        color: #b91c1c;
      }
      table.cc-up-t tr.off td {
        color: var(--c-text-muted);
      }
      table.cc-up-t tr.off td:nth-child(3) {
        text-decoration: line-through;
      }
      .cc-bdot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: 1px;
      }

      @media (max-width: 980px) {
        .cc-cols {
          grid-template-columns: 1fr;
        }
        .cc-sum {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 640px) {
        .cc-cell {
          min-height: 78px;
          padding: 4px 3px;
        }
        /* 좁아도 빈 막대로 만들지 않는다. 시간을 윗줄로 올려 이름을 살린다 */
        .cc-ev {
          font-size: 9.5px;
          line-height: 1.3;
          padding: 2px 3px;
          letter-spacing: -0.3px;
          white-space: normal;
        }
        .cc-ev .t {
          display: block;
          margin-right: 0;
        }
        .cc-cell .d {
          font-size: 12px;
          width: 20px;
          height: 20px;
        }
        .cc-side-body {
          max-height: none;
        }
        /* 표를 좁히면 이름이 한 글자씩 세로로 떨어진다 → 카드로 바꾼다 */
        table.cc-up-t thead {
          display: none;
        }
        table.cc-up-t,
        table.cc-up-t tbody,
        table.cc-up-t tr,
        table.cc-up-t td {
          display: block;
          width: auto;
        }
        table.cc-up-t tr {
          display: grid;
          grid-template-columns: auto 1fr;
          gap: 3px 8px;
          align-items: center;
          padding: 12px 14px;
          border-bottom: 1px solid var(--c-border-soft);
        }
        table.cc-up-t tr:last-child {
          border-bottom: 0;
        }
        table.cc-up-t td {
          border: 0;
          padding: 0;
          font-size: 13px;
        }
        table.cc-up-t td:nth-child(2) {
          font-weight: 600;
        }
        table.cc-up-t td:nth-child(3) {
          grid-column: 1 / -1;
          font-size: 14px;
          font-weight: 600;
          margin-top: 3px;
        }
        table.cc-up-t td:nth-child(4),
        table.cc-up-t td:nth-child(5) {
          grid-column: 1 / -1;
          color: var(--c-text-sub);
          font-size: 12.5px;
        }
      }
      .cc-sum { gap:0; margin-bottom:14px; border:1px solid var(--c-border); border-radius:var(--radius); background:#fff; box-shadow:none; }
      .cc-sum .card, .cc-sum .card.accent { border:0; border-right:1px solid var(--c-border-soft); border-radius:0; padding:10px 14px; box-shadow:none; background:#fff; }
      .cc-sum .card:last-child { border-right:0; }
      .cc-sum .label { margin-bottom:4px; font-size:11px; }
      .cc-sum .value { font-size:20px; }
      .cc-bar { border:0; border-bottom:1px solid var(--c-border); border-radius:0; padding:0 0 10px; background:transparent; box-shadow:none; }
      .cc-cal, .cc-side { box-shadow:none; }
      .cc-side-head { background:#fff; color:var(--c-text); }
      .cc-side-head .n { color:var(--c-text-sub); }
      .cc-week-slot { border-right:1px solid var(--c-border-soft); border-bottom:1px solid var(--c-border-soft); }
      .cc-week-event .cc-week-time, .cc-week-event .cc-week-customer { color:#67717e; font-size:11px; }
      @media (max-width:640px) {
        /* M01 mobile: three dates are one page. Previous/next moves by exactly 3 days. */
        .page-header { margin-bottom:8px; padding-bottom:0; }
        .page-header h2 { font-size:18px; margin-bottom:0; }
        .page-header p { display:none; }
        .page-actions { gap:4px; }
        .page-actions .btn { min-height:34px; padding:5px 8px; font-size:12px; }
        .cc-sum, .cc-filter { display:none; }
        .cc-up { margin-top:14px; }
        .cc-up-head { flex-wrap:wrap; gap:4px; padding:12px 14px; }
        .cc-up-head .hint { width:100%; margin-left:0; font-size:11px; }
        table.cc-up-t td { min-width:0; overflow-wrap:anywhere; }
        table.cc-up-t td[colspan] { grid-column:1 / -1; }
        .cc-bar { margin-bottom:8px; padding-bottom:8px; }
        .cc-month { width:100%; justify-content:space-between; }
        .cc-month .m { min-width:0; font-size:15px; }
