<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>미팅 설정 · DAYONE ADMIN</title><meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="https://day1design.co.kr/css/fonts.css"><link rel="stylesheet" href="https://day1design.co.kr/css/reset.css"><link rel="stylesheet" href="admin.css?v=20260903-branch">
  <style>
    .ms-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:16px}.ms-card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-card)}.ms-card h3{margin:0 0 12px}.ms-table{width:100%;border-collapse:collapse}.ms-table th,.ms-table td{padding:10px 8px;border-bottom:1px solid var(--c-border-soft);text-align:left;font-size:13px;vertical-align:middle}.ms-table th{color:var(--c-text-sub);font-size:12px}.ms-color{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.ms-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.ms-field label{font-size:12px;font-weight:600}.ms-field input,.ms-field select,.ms-field textarea{width:100%;min-height:38px;border:1px solid var(--c-border);border-radius:6px;padding:7px 9px;background:var(--c-surface);color:var(--c-text)}.ms-notice{padding:10px 12px;background:var(--c-brand-soft);border-radius:6px;font-size:12px;color:var(--c-text-sub);margin-bottom:12px}.ms-vars{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 12px}.ms-var{border:1px solid var(--c-border);border-radius:999px;background:var(--c-surface);padding:4px 8px;font-size:11px;cursor:pointer}.ms-preview{padding:10px;background:#fafbfc;border:1px solid var(--c-border-soft);border-radius:6px;font-size:12px;line-height:1.7;white-space:pre-wrap}.ms-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.ms-loading{color:var(--c-text-sub);padding:10px 0}@media(max-width:900px){.ms-grid{grid-template-columns:1fr}}
    .ms-color-blue{background:#2563eb}.ms-color-green{background:#16a34a}.ms-color-purple{background:#8b5cf6}.ms-color-orange{background:#f59e0b}.ms-color-pink{background:#ec4899}.ms-color-teal{background:#0d9488}
    #msBuffer{display:none}.ms-field:has(#msBuffer)::after{content:"60분 · 고정";display:block;min-height:38px;border:1px solid var(--c-border);border-radius:6px;padding:7px 9px;color:var(--c-text-sub);background:#f8f9fb}
    .ms-var:hover,.ms-var:focus-visible{background:#1f2937;color:#fff;border-color:#1f2937}.ms-table button:hover,.ms-table button:focus-visible{background:#1f2937;color:#fff;border-color:#1f2937}
  </style>

<body class="admin-body"><aside class="admin-sidebar" id="adminSidebar" aria-label="관리자 메뉴"></aside><div class="admin-backdrop" id="adminBackdrop" aria-hidden="true"></div><div class="admin-layout"><header class="admin-topbar" id="adminTopbar"></header><main class="admin-content"><div class="page-header"><div><h2>미팅 설정</h2><p>미팅 유형, 시간 블록, 캘린더 알림 메시지를 관리합니다. 모든 시간은 KST입니다.</p></div><div class="page-actions"><a class="btn btn-ghost" href="calendar">주간 시간표</a></div></div><div id="msFeedback" class="ms-notice" hidden></div><div class="ms-grid"><section class="ms-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>미팅 유형</h3><button class="btn btn-primary" id="msAdd" type="button">유형 추가</button></div><p class="ms-notice">시작 가능 시간은 10:00부터 19:00까지입니다. 진행 시간 뒤에는 유형별 여유시간이 예약 차단으로 적용됩니다.</p><div class="table-scroll"><table class="ms-table"><thead><tr><th>색상</th><th>미팅명</th><th>진행</th><th>여유</th><th>상태</th><th></th></tr></thead><tbody id="msTypes"></tbody></table></div></section><section class="ms-card"><h3 id="msFormTitle">미팅 유형 추가</h3><form id="msTypeForm"><div class="ms-field"><label for="msName">미팅명</label><input id="msName" maxlength="40" required placeholder="예: 이니셜미팅"></div><div class="ms-field"><label for="msDuration">진행 시간</label><select id="msDuration"><option value="60">1시간</option><option value="120">2시간</option><option value="180">3시간</option><option value="240">4시간</option></select></div><div class="ms-field"><label for="msBuffer">후행 여유시간</label><select id="msBuffer"><option value="60">1시간</option><option value="30">30분</option><option value="0">없음</option></select></div><div class="ms-field"><label for="msColor">색상 계층</label><select id="msColor"><option value="blue">파랑</option><option value="green">초록</option><option value="purple">보라</option><option value="orange">주황</option><option value="pink">분홍</option><option value="teal">청록</option></select></div><div class="ms-actions"><button class="btn btn-ghost" type="button" id="msReset">초기화</button><button class="btn btn-primary" type="submit">유형 저장</button></div></form></section></div><section class="ms-card" style="margin-top:16px"><h3>캘린더 알림 메시지</h3><p class="ms-notice">실제 테스트 발송은 제공하지 않습니다. 예약 생성·1일 전·당일 2시간 전 알림을 켜고, 미팅 유형별 변수값을 미리 확인할 수 있습니다.</p><div id="msNotifications"></div><div class="ms-field" style="margin-top:14px"><label for="msNotifType">미리보기 미팅 유형</label><select id="msNotifType"></select></div><div class="ms-preview" id="msPreview">미리보기 준비 중</div><div class="ms-actions"><button class="btn btn-primary" type="button" id="msSave">설정 저장</button></div></section></main></div><div class="toast" id="toast"></div><script defer src="config.js"></script><script defer src="admin.js?v=20260911-menu2"></script><script defer src="meeting-settings.js?v=20260910"></script></body></html>
